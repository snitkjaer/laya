# Use with compose.yaml, and with compose.http.yaml when serving over HTTP. The
# `laya-serve` entry repeats the ROCm build args and devices because it is a separate
# service: overrides for `laya` never reach it, so it would serve on CPU.
#
# ROCm PyTorch exposes AMD GPUs through the `cuda` device type, so LAYA_DEVICE stays
# `cuda`. The container needs /dev/kfd and /dev/dri plus the host's render and video
# groups. Docker resolves group names inside the image, which has neither, so pass the
# host's numeric IDs (they differ between distributions):
#
#   export LAYA_RENDER_GID=$(getent group render | cut -d: -f3)
#   export LAYA_VIDEO_GID=$(getent group video | cut -d: -f3)
services:
  laya:
    build:
      args:
        TORCH_INDEX: "${LAYA_TORCH_INDEX:-rocm7.2}"
    environment:
      LAYA_DEVICE: "${LAYA_DEVICE:-cuda}"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - "${LAYA_RENDER_GID:?Set LAYA_RENDER_GID, e.g. export LAYA_RENDER_GID=$$(getent group render | cut -d: -f3)}"
      - "${LAYA_VIDEO_GID:?Set LAYA_VIDEO_GID, e.g. export LAYA_VIDEO_GID=$$(getent group video | cut -d: -f3)}"

  laya-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${LAYA_TORCH_INDEX:-rocm7.2}"
    environment:
      LAYA_DEVICE: "${LAYA_DEVICE:-cuda}"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - "${LAYA_RENDER_GID:?Set LAYA_RENDER_GID, e.g. export LAYA_RENDER_GID=$$(getent group render | cut -d: -f3)}"
      - "${LAYA_VIDEO_GID:?Set LAYA_VIDEO_GID, e.g. export LAYA_VIDEO_GID=$$(getent group video | cut -d: -f3)}"
